<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 4px 2px; font: 14px/20px -apple-system, "Segoe UI", system-ui, sans-serif; color: #1f1f1f; }
  textarea, input { width: 100%; box-sizing: border-box; border: 1px solid #c7c7c7; border-radius: 8px;
    padding: 10px; font: 13px/18px ui-monospace, Menlo, Consolas, monospace; color: #1f1f1f; background: #f8f8f8; }
  textarea { height: 96px; resize: none; word-break: break-all; }
  button { margin-top: 12px; height: 40px; padding: 0 20px; border: 0; border-radius: 20px;
    background: #1f1f1f; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  p { margin: 0 0 12px; }
  .error { color: #b3261e; margin-top: 8px; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <div id="conCodigo" <? if (!codigo) { ?>hidden<? } ?>>
    <textarea id="codigo" readonly aria-label="Código de acceso"><?= codigo ?></textarea>
    <button id="copiar" type="button">Copiar</button>
  </div>

  <div id="sinCodigo" <? if (codigo) { ?>hidden<? } ?>>
    <p>Pega aquí la URL de la aplicación web que te dio Google al implementar el script (termina en /exec).</p>
    <input id="url" type="url" aria-label="URL de la aplicación web" placeholder="https://script.google.com/macros/s/…/exec">
    <div id="error" class="error" hidden>Esta URL no es válida. Copia la que termina en /exec.</div>
    <button id="guardar" type="button">Mostrar mi código</button>
  </div>

<script>
  var campo = document.getElementById('codigo');

  function copiar() {
    campo.focus();
    campo.select();
    var hecho = false;
    try { hecho = document.execCommand('copy'); } catch (e) { hecho = false; }
    if (!hecho && navigator.clipboard) navigator.clipboard.writeText(campo.value).catch(function () {});
  }
  document.getElementById('copiar').addEventListener('click', copiar);

  document.getElementById('guardar').addEventListener('click', function () {
    var boton = this;
    boton.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        boton.disabled = false;
        if (!r || !r.ok) { document.getElementById('error').hidden = false; return; }
        campo.value = r.codigo;
        document.getElementById('sinCodigo').hidden = true;
        document.getElementById('conCodigo').hidden = false;
      })
      .withFailureHandler(function () {
        boton.disabled = false;
        document.getElementById('error').hidden = false;
      })
      .guardarUrlAplicacion(document.getElementById('url').value);
  });
</script>
</body>
</html>
